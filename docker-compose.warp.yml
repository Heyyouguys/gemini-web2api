services:
  warp:
    image: caomingjun/warp:latest
    restart: unless-stopped
    device_cgroup_rules:
      - 'c 10:200 rwm'
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv4.conf.all.src_valid_mark: "1"
    environment:
      WARP_SLEEP: "2"
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    # The image provides HTTP and SOCKS5 on 1080; keep it inside Docker.
    expose:
      - "1080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 15 --socks5-hostname 127.0.0.1:1080 https://www.cloudflare.com/cdn-cgi/trace | grep -Eq '^warp=(on|plus)$'"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s

  gemini-web2api:
    image: ${GEMINI_WEB2API_IMAGE:-ghcr.io/heyyouguys/gemini-web2api:latest}
    build: .
    container_name: gemini-web2api
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./config.json:/app/config.json:ro
    environment:
      GEMINI_WARP_ENABLED: "true"
      GEMINI_WARP_PROXY: "socks5://warp:1080"
    depends_on:
      warp:
        condition: service_healthy

volumes:
  warp-data:
